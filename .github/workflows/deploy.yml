# Documentation:
# https://github.com/marketplace/actions/github-pages-action#%EF%B8%8F-static-site-generators-with-nodejs
name: Deploy

on:
  push:
    branches:
      - master

jobs:
  version:
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.msg), '[skip deploy]')"

    steps:
      - uses: actions/checkout@v2

      - name: NPM versioning
        run: /bin/bash ./bin/npm-version.sh

      - name:
        run: git filter-branch --msg-filter 'printf "[norelease] [skip deploy] " && cat' HEAD

      - name: Tag
        run: git push && git push --tags

  deploy:
    needs: version
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Setup Node
      uses: actions/setup-node@v1
      with:
        node-version: '10.x'

    - name: Cache dependencies
      uses: actions/cache@v1
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Install
      run: npm ci

    - name: Build
      run: npm run build --if-present
      env:
        CI: true

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v2
      env:
        ACTIONS_DEPLOY_KEY: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        PUBLISH_BRANCH: gh-pages
        PUBLISH_DIR: ./dist
